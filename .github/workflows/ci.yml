name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps -r requirements-test.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
      - name: Install pinned Rootline
        run: >-
          go install
          github.com/pablontiv/rootline/cmd/rootline@14ee8aa4d5067c7ff6d0708d79e3aaebf27b7a56
      - name: Run handbook documentation contract
        run: >-
          python -m unittest discover
          -s tests
          -p "test_*.py"
          -v
      - name: Run profile contract tests
        run: >-
          python -m unittest discover
          -s profiles/pablontiv/tests
          -t profiles/pablontiv
          -p "test_*.py"
          -v
      - name: Run ADR workspace tests
        run: >-
          python -m unittest discover
          -s skills/adr/tests
          -t skills/adr
          -p "test_*.py"
          -v
      - name: Validate governed knowledge
        run: |
          rootline validate --all .workspace/docs/adr -o json
          rootline validate --all .workspace/docs/superpowers -o json
          rootline validate --all profiles/pablontiv -o json
      - name: Run systemic issue triage tests
        run: >-
          python -m unittest discover
          -s skills/systemic-issue-triage/tests
          -t skills/systemic-issue-triage
          -p "test_*.py"
          -v
      - name: Run context-save contract tests
        run: >-
          python -m unittest discover
          -s skills/context-save/tests
          -t skills/context-save
          -p "test_*.py"
          -v
      - name: Run sweep contract tests
        run: >-
          python -m unittest discover
          -s skills/sweep/tests
          -t skills/sweep
          -p "test_*.py"
          -v
      - name: Run sweep asset tests
        if: runner.os != 'Windows'
        run: sh skills/sweep/assets/test-assets.sh
      - name: Run unit tests
        working-directory: skills/remove-gentle-context
        run: python -m unittest discover -s tests -t . -v
      - name: Compile CLI
        working-directory: skills/remove-gentle-context
        run: python -m py_compile scripts/cleanup.py
      - name: CLI help
        working-directory: skills/remove-gentle-context
        run: python scripts/cleanup.py --help
