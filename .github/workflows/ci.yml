name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run systemic issue triage tests
        run: >-
          python -m unittest discover
          -s skills/systemic-issue-triage/tests
          -t skills/systemic-issue-triage
          -p "test_*.py"
          -v
      - name: Run context-save contract tests
        run: >-
          python -m unittest discover
          -s skills/context-save/tests
          -t skills/context-save
          -p "test_*.py"
          -v
      - name: Run sweep contract tests
        run: >-
          python -m unittest discover
          -s skills/sweep/tests
          -t skills/sweep
          -p "test_*.py"
          -v
      - name: Run sweep asset tests
        if: runner.os != 'Windows'
        run: sh skills/sweep/assets/test-assets.sh
      - name: Run unit tests
        working-directory: skills/remove-gentle-context
        run: python -m unittest discover -s tests -t . -v
      - name: Compile CLI
        working-directory: skills/remove-gentle-context
        run: python -m py_compile scripts/cleanup.py
      - name: CLI help
        working-directory: skills/remove-gentle-context
        run: python scripts/cleanup.py --help
